[project]
name = "sew1-workbench"
version = "0.1.0"
description = "SEW1 requirements workbench for the in-car AI companion"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["packs/*.yaml"]
"app.agents" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
